<!doctype html>
<html lang="en">
<head>
{% include head.html %}
<link rel="stylesheet" href="{{ '/assets/css/jiwon.css' | relative_url }}?v=20261031-top2">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body class="jw-site">
<a class="skip-link" href="#content">Skip to content</a>
<header class="jw-topbar"><a class="jw-brand" href="{{ '/' | relative_url }}">Jiwon Kim<span>.</span></a><nav aria-label="Main navigation" class="jw-topnav">{% for link in site.data.navigation.main %}<a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a>{% endfor %}</nav></header>
<main id="content" class="jw-main">
  <div class="jw-content{% if page.url == '/cv/' %} jw-cv{% endif %}">
  {% unless page.url == '/' %}<h1>{{ page.title }}</h1>{% endunless %}
  {{ content }}
  </div>
  <footer class="jw-footer"><div class="jw-footer-links"><a href="mailto:kim.jiwon@ewha.ac.kr">Email ↗</a> <a href="https://bigdataewha.github.io/ko/index.html">AAPL Lab ↗</a> <a href="https://www.linkedin.com/in/jiwon-kim-jwkim">LinkedIn ↗</a></div>© {{ site.time | date: '%Y' }} Jiwon Kim </footer>
</main>
</body>
</html>
